name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build for Vercel
        run: npm run build
        env:
          NITRO_PRESET: vercel
          VITE_API_URL: http://127.0.0.1:4000

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teamflow_ci
          POSTGRES_PASSWORD: teamflow_ci_password
          POSTGRES_DB: teamflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamflow_ci -d teamflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://teamflow_ci:teamflow_ci_password@127.0.0.1:5432/teamflow_ci?schema=public
      JWT_SECRET: teamflow-ci-only-jwt-secret-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply migrations to fresh PostgreSQL
        run: npm run prisma:migrate:deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Verify migrated schema matches Prisma schema
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Test
        run: npm test
